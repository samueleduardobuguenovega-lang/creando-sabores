name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    name: Pruebas de integración
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creando_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        working-directory: app
        run: npm ci

      - name: Correr las pruebas
        working-directory: app
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/creando_test
          SESSION_SECRET: secreto-de-integracion-continua
          NODE_ENV: test
        run: npm test
